services:
  db:
    build:
      context: ./db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U portfolio -d portfolio" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 5491
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD}@db:5432/portfolio
    expose:
      - "5491"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_NAME: backend
      BACKEND_PORT: 5491
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  pgdata:
